services:
  app:
    build: .
    container_name: transacpharma
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Clé API Pappers pour l'enrichissement SIREN (compte gratuit sur pappers.fr/api)
      - PAPPERS_API_TOKEN=${PAPPERS_API_TOKEN:-}
    volumes:
      - pharma-db:/app/db
    restart: unless-stopped

volumes:
  pharma-db:
