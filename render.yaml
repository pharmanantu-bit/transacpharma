# Blueprint de déploiement Render — TransacPharma (offre GRATUITE)
#
# La base est hébergée sur Turso (libSQL cloud, gratuit), donc aucun disque
# persistant payant n'est nécessaire : le plan "free" suffit.
#
# Mise en place : https://dashboard.render.com → New + → Blueprint → connecter
# le dépôt GitHub. Render lit ce fichier automatiquement.
#
# ℹ️ Sur l'offre gratuite, le service se met en veille après ~15 min d'inactivité
# et se réveille en ~30 s au premier accès suivant. Les données ne sont PAS
# perdues (elles vivent dans Turso, pas sur le service Render).

services:
  - type: web
    name: transacpharma
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_USER
        value: apothical
      # --- Variables secrètes : à saisir dans le dashboard Render ---
      # Mot de passe partagé d'accès à l'app (obligatoire)
      - key: APP_PASSWORD
        sync: false
      # Connexion Turso (libSQL) — base de données cloud
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Clé Pappers optionnelle (enrichissement capital / CA détaillé)
      - key: PAPPERS_API_TOKEN
        sync: false
